<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background: #b2a9be; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
        }
        .device-frame { 
            background: #000000; 
            padding: 6px; 
            border-radius: 46px; 
            width: 100%; 
            max-width: 432px; 
            box-sizing: border-box; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .app-container { 
            background: #ffffff; 
            width: 100%; 
            height: 740px; /* Fixed height for desktop frame simulation */
            border-radius: 40px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            box-sizing: border-box; 
            padding: 40px 24px; /* Added padding to keep content spaced beautifully */
            justify-content: center;
        }

        /* --- Pure CSS Logo Styles --- */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .logo-icon-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            margin-bottom: 0.5rem;
        }
        .logo-badge {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .cap-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: #ffffff;
            font-size: 20px;
            top: 0;
            left: 0;
            z-index: 2;
        }
        .chat-badge {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #059669, #047857);
            color: #ffffff;
            font-size: 15px;
            bottom: 0;
            right: 0;
            z-index: 1;
            border: 3px solid #ffffff;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .logo-text span {
            color: #4f46e5;
        }

        /* --- Form Elements --- */
        .form-input { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            font-size: 14px; 
            outline: none; 
            box-sizing: border-box; 
            margin-bottom: 16px; 
            font-family: inherit;
        }
        .form-input:focus {
            border-color: #4f46e5;
        }
        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 15px; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        .login-btn:hover {
            background: #4338ca;
        }

        /* --- MOBILE RESPONSIVE ADJUSTMENT --- */
        @media (max-width: 480px) {
            .device-frame {
                padding: 0;
                border-radius: 0;
                max-width: 100%;
                height: 100vh;
                box-shadow: none;
            }
            .app-container {
                border-radius: 0;
                height: 100vh; /* Fills full mobile viewport height */
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="device-frame">
        <div class="app-container">
            
            <div class="logo-container">
                <div class="logo-icon-wrapper">
                    <div class="logo-badge cap-badge">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div class="logo-badge chat-badge">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                </div>
                <h1 class="logo-text">Edu<span>Connect</span></h1>
            </div>

            <h2 style="color: #1e293b; margin: 0 0 4px 0; font-size: 20px;">Welcome to EduConnect</h2>
            <p style="color: #64748b; font-size: 13px; margin: 0 0 24px 0;">Please sign in to access your dashboard</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for msg in messages %}
                  <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; border: 1px solid rgba(239, 68, 68, 0.2);">
                      {{ msg }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                <input type="text" name="username" class="form-input" placeholder="Username (School Admin)" required autocomplete="off">
                <input type="password" name="password" class="form-input" placeholder="Password" required>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
