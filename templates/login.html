<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #b2a9be; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
        }
        .device-frame { 
            background: #000000; 
            padding: 6px; 
            border-radius: 46px; 
            width: 100%; 
            max-width: 432px; 
            box-sizing: border-box; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .app-container { 
            background: #ffffff; 
            width: 100%; 
            height: 530px; 
            border-radius: 40px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 40px; 
            box-sizing: border-box; 
            text-align: center; 
        }
        .form-input { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            font-size: 14px; 
            outline: none; 
            box-sizing: border-box; 
            margin-bottom: 16px; 
            font-family: inherit;
        }
        .form-input:focus {
            border-color: #6366f1;
        }
        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: #6366f1; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 15px; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        .login-btn:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="app-container">
            <h2 style="color: #1e293b; margin: 0 0 6px 0; font-size: 24px;">Welcome to EduConnect</h2>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 32px 0;">Please sign in to access your dashboard</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for msg in messages %}
                  <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; border: 1px solid rgba(239, 68, 68, 0.2);">
                      {{ msg }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                <input type="text" name="username" class="form-input" placeholder="Username (School Admin)" required autocomplete="off">
                <input type="password" name="password" class="form-input" placeholder="Password" required>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
