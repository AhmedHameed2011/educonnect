<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content" style="display: flex; flex-direction: column; justify-content: center; padding: 24px; height: 100%;">
            
            <div class="logo-container">
                <div class="logo-icon-wrapper">
                    <div class="logo-badge cap-badge">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div class="logo-badge chat-badge">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                </div>
                <h1 class="logo-text">Edu<span>Connect</span></h1>
            </div>

            
            <div class="glass-panel" style="padding: 24px; border-radius: 24px; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border);">
                <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; color: var(--text-main);">تسجيل الدخول إلى حسابك</h2>
                
                <form action="" method="POST">
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted);">اسم المستخدم</label>
                        <div class="search-bar" style="margin-bottom: 0; padding: 10px 14px; border-radius: 12px;">
                            <i class="fa-solid fa-user" style="margin-left: 12px; margin-right: 0;"></i>
                            <input type="text" name="username" placeholder="أدخل اسم المستخدم" required style="font-size: 14px;">
                        </div>
                    </div>

                    <div style="margin-bottom: 24px;">
                        <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted);">كلمة المرور</label>
                        <div class="search-bar" style="margin-bottom: 0; padding: 10px 14px; border-radius: 12px;">
                            <i class="fa-solid fa-lock" style="margin-left: 12px; margin-right: 0;"></i>
                            <input type="password" name="password" placeholder="أدخل كلمة المرور" required style="font-size: 14px;">
                        </div>
                    </div>

                    <button type="submit" class="login-btn" style="padding: 12px; border-radius: 12px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border: none; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);">
                        <span>دخول</span>
                        <i class="fa-solid fa-arrow-right-to-bracket" style="font-size: 16px;"></i>
                    </button>
                </form>
            </div>

            <p style="text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px;">
                نظام إدارة التواصل المدرسي الذكي
            </p>

        </main>
    </div>

    {% with messages = get_flashed_messages() %}
  {% if messages %}
    <script>
        alert("⚠️ {{ messages[0] }}");
    </script>
  {% endif %}
{% endwith %}

</body>
</html>
